name: Validate and deploy Fursay Worker

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fursay-worker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci && npx playwright install --with-deps chromium

      - name: Check deploy readiness
        run: npm run deploy:ready

      - name: Run local release gate
        run: node scripts/release-fursay.mjs --skip-deploy --skip-live

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fursay-release-evidence-${{ github.run_id }}
          path: |
            /tmp/fursay-release-*
            /tmp/fursay-smoke-live
            /tmp/fursay-event-analytics-report
          if-no-files-found: warn
          retention-days: 14

  deploy-production:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci && npx playwright install --with-deps chromium
      - name: Check production deployment readiness
        run: npm run deploy:ready -- --require-remote --require-cloudflare
      - name: Deploy Worker Static Assets
        run: node scripts/release-fursay.mjs --skip-live
      - name: Query Analytics Engine conversion report
        if: env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_ANALYTICS_TOKEN != ''
        run: npm run report:events -- --out-dir /tmp/fursay-event-analytics-report
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fursay-production-evidence-${{ github.run_id }}
          path: |
            /tmp/fursay-release-*
            /tmp/fursay-smoke-live
            /tmp/fursay-event-analytics-report
          if-no-files-found: warn
          retention-days: 14
